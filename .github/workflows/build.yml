name: Build JLCEDA Extension

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: x64
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build extension
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jlceda-extension-windows-x86_64
          path: build/dist/*.eext
          if-no-files-found: error

      - name: Create GitHub Release and upload extension
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -Path "build/dist" -Filter "*.eext" |
            Select-Object -ExpandProperty FullName

          if (-not $assets) {
            throw "No .eext build artifact was found."
          }

          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" $assets `
              --repo "${{ github.repository }}" `
              --clobber
          } else {
            gh release create "${{ github.ref_name }}" $assets `
              --repo "${{ github.repository }}" `
              --title "${{ github.ref_name }}" `
              --generate-notes
          }
